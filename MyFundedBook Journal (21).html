<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MyFundedBook Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: left sidebar nav (desktop) / bottom nav (phone); each view = filter bar + panels. Dark-first, gold accent for XAUUSD. */
:root {
  --bg: #000000; --surface: #040405; --surface-2: #0c0c0e; --line: #1b1b1f;
  --fg: #e4e4e2; --muted: #92969f; --accent: #ffc53d; --accent-ink: #1a1200;
  --win: #22e58f; --loss: #ff4d57; --be: #8f96a6;
  --win-bg: rgba(34,229,143,.16); --loss-bg: rgba(255,77,87,.16); --accent-bg: rgba(255,197,61,.14);
  --shadow: 0 10px 40px rgba(0,0,0,.7);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
/* Black is the default everywhere; light only when chosen inside the app. */
:root.app-light {
  --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f0eee8; --line: #e0ddd4;
  --fg: #1b1d22; --muted: #646a75; --accent: #a87a16; --accent-ink: #fffaf0;
  --win: #1d8a5c; --loss: #c8423b; --be: #8a8f99;
  --win-bg: rgba(29,138,92,.11); --loss-bg: rgba(200,66,59,.11); --accent-bg: rgba(168,122,22,.11);
  --shadow: 0 10px 40px rgba(30,30,20,.14); color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.win { color: var(--win); } .loss { color: var(--loss); } .muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-word { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .14em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(140deg, #f0cf7a, #b98a2c); display: grid; place-items: center; color: #2a1d05; font-size: 12px; font-weight: 700; font-family: var(--f-mono); }
.side .add { margin-bottom: 12px; justify-content: center; }
.nav { background: none; border: 0; text-align: left; padding: 9px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; width: 100%; }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav:hover { color: var(--fg); background: var(--surface-2); }
.nav[aria-current="page"] { color: var(--fg); background: var(--accent-bg); }
.nav[aria-current="page"] svg { color: var(--accent); }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px 8px 0; display: grid; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
.dot.ok { background: var(--win); }
main { min-width: 0; padding-inline: 24px 38px; padding-block: 20px 110px; width: 100%; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; }
.btn.danger { color: var(--loss); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; }

.pagehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-family: var(--f-display); font-size: 24px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 19px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-size: 14.5px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.gfilter { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.gfilter select, .gfilter input { padding: 6px 9px; font-size: 13.5px; }
.banner { border: 1px dashed var(--accent); background: var(--accent-bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; font-size: 13.5px; }
.banner b { color: var(--accent); }
.banner .sp { flex: 1; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
button.kpi { text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.kpi:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.kpi .mid { font-family: var(--f-mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dirbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-dash2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1.25fr); }
.g-dash3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.mt { margin-top: 14px; }
.kpi { display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.kpi .row1 { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
.kpi .big { font-family: var(--f-mono); font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi svg text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.legend3 { display: flex; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; }
.legend3 span { padding: 1px 6px; border-radius: 6px; }
.legend3 .w { background: var(--win-bg); color: var(--win); } .legend3 .b { background: var(--surface-2); color: var(--be); } .legend3 .l { background: var(--loss-bg); color: var(--loss); }
.wlbar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin-top: 6px; }
.wlbar i { display: block; height: 100%; }
.chart-box { width: 100%; min-height: 40px; }
.chart-box svg { display: block; }
.chart-box text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.chart-box [data-ti] { cursor: crosshair; }
.chart-box .tipbar[data-ti], .chart-box .tipzone { fill: transparent; }
.chart-box.hov .bar { opacity: .35; transition: opacity .12s; } .chart-box.hov .bar.on { opacity: 1; }
.chart-box .cguide, .chart-box .cdot { opacity: 0; pointer-events: none; transition: opacity .12s; } .chart-box.hov .cguide, .chart-box.hov .cdot { opacity: 1; }
.chart-box .rdot { transition: r .12s; } .chart-box .rdot.on { r: 6; }
#ctip { position: fixed; z-index: 85; pointer-events: none; min-width: 190px; max-width: 270px; background: var(--surface-2); border: 1px solid #2a2a30; border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; }
#ctip[hidden] { display: none; }
#ctip .th { font-weight: 700; margin-bottom: 6px; color: var(--fg); }
#ctip .tr { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
#ctip .tr b { font-family: var(--f-mono); font-weight: 600; color: var(--fg); }
#ctip .tr b.win { color: var(--win); } #ctip .tr b.loss { color: var(--loss); }
#ctip .tn { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
.score-big { font-family: var(--f-mono); font-size: 30px; font-weight: 600; }
.scorebar { height: 8px; border-radius: 5px; background: linear-gradient(90deg, var(--loss), var(--accent), var(--win)); position: relative; margin: 8px 0 4px; }
.scorebar i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--fg); transform: translateX(-2px); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th[data-act] { cursor: pointer; }
th[data-act]:hover { color: var(--fg); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; display: inline-block; }
.badge.win, .badge.long { background: var(--win-bg); color: var(--win); }
.badge.loss, .badge.short { background: var(--loss-bg); color: var(--loss); }
.badge.be, .badge.open { background: var(--surface-2); color: var(--be); }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.chip.m { background: var(--loss-bg); color: var(--loss); }
.chip.p { background: var(--accent-bg); color: var(--accent); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.stars { color: var(--accent); letter-spacing: 1px; }
.stars .off { color: var(--line); }
.tabsbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabsbar button { background: none; border: 0; padding: 9px 12px; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabsbar button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.empty b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.toolbar input[type="search"] { flex: 1 1 200px; }
.tpop { position: relative; display: inline-flex; }
.tpbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--fg); font: inherit; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; }
.tpbtn span { font-size: 10px; color: var(--muted); }
.tpbox { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: min(720px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.tphead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
@media (max-width: 860px) { .tpop.open { flex-basis: 100%; flex-direction: column; } .tpop.open .tpbtn { align-self: flex-start; } .tpbox { position: static; width: 100%; margin-top: 6px; box-shadow: none; } }
.vseg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.vseg button { background: var(--surface); border: 0; padding: 6px 12px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.vseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.gcardt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; transition: border-color .15s, transform .15s; }
.gcardt:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); transform: translateY(-2px); }
.gcardt .gimg { aspect-ratio: 16/9; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; overflow: hidden; }
.gcardt .gimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gcardt .gimg .noshot { border: 0; border-radius: 0; width: 100%; height: 100%; aspect-ratio: auto; }
.gcardt .gbody { padding: 10px 12px 12px; display: grid; gap: 4px; }
.gcardt .gtop { display: flex; align-items: center; gap: 8px; }
.gcardt .gpnl { font-family: var(--f-mono); font-weight: 600; font-size: 16px; }
.gcardt .gmeta { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); letter-spacing: .02em; }
.gcardt .glogic { font-size: 12.5px; color: var(--fg); opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 1.4em; }
.on { border-color: var(--accent) !important; }
select { color: var(--fg); background-color: var(--surface); }
.mpick { position: relative; }
.mpbtn { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; cursor: pointer; color: var(--fg); }
.mpbtn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mpbtn span.none { color: var(--muted); }
.mpbtn:focus-visible, .mpick.open .mpbtn { border-color: var(--accent); outline: none; }
.mpbtn svg { flex: none; transition: transform .15s; } .mpick.open .mpbtn svg { transform: rotate(180deg); }
.mpbox { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; max-height: 260px; overflow: auto; }
.mpbox label { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.mpbox label:hover { background: var(--surface); }
.mpbox input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.mpbox label:has(input:checked) { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
.mpbox label:has(input:focus-visible) { outline: 1px solid var(--accent); }
.mpbox .mphint { font-size: 11.5px; color: var(--muted); padding: 6px 10px 4px; }
option, optgroup { background-color: var(--surface); color: var(--fg); }
html { -webkit-tap-highlight-color: transparent; }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-head .month { font-family: var(--f-display); font-size: 17px; font-weight: 700; min-width: 140px; text-align: center; }
.cal-head .msum { margin-left: auto; font-size: 13px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.1fr); gap: 5px; }
.cal .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 0 4px; }
.day { min-height: 92px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 5px 7px; display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; cursor: pointer; }
.day.out { opacity: .3; }
.day:hover { border-color: var(--muted); }
.day.pos { background: var(--win-bg); border-color: color-mix(in srgb, var(--win) 35%, transparent); }
.day.neg { background: var(--loss-bg); border-color: color-mix(in srgb, var(--loss) 35%, transparent); }
.day.today .d { color: var(--accent); }
.day .d { font-size: 11.5px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
.day .p { font-family: var(--f-mono); font-weight: 600; font-size: 13px; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .n { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .ps { display: none; }
.week { min-height: 92px; border-radius: 9px; padding: 5px 7px; background: var(--surface-2); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.week .p { font-family: var(--f-mono); font-weight: 600; font-size: 13px; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* journal */
.jday { padding: 0; overflow: hidden; }
.jday-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.jday-head .date { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.jday-head .net { font-family: var(--f-mono); font-weight: 600; font-size: 16px; }
.jday-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; padding: 14px 16px; }
.mstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; align-content: start; }
.mstats .v { font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.jday textarea { width: 100%; min-height: 70px; }
.jday details { border-top: 1px solid var(--line); }
.jday summary { padding: 10px 16px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }

/* trade detail */
.td-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0; }
.kv > div { padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(odd) { color: var(--muted); font-size: 13px; padding-right: 12px; }
.kv > div:nth-child(even) { text-align: right; font-family: var(--f-mono); font-weight: 500; overflow-wrap: anywhere; }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.shotview img { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #0a0c10; display: block; cursor: zoom-in; }
.shotview.both { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.noshot { aspect-ratio: 16/9; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
.notes-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.rulecheck { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
.rulecheck input { margin-top: 3px; accent-color: var(--accent); }
.starbtn { background: none; border: 0; cursor: pointer; font-size: 20px; color: var(--line); padding: 0 1px; line-height: 1; }
.starbtn.on2 { color: var(--accent); }

/* notebook */
.nb { display: grid; grid-template-columns: 190px minmax(0, 260px) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); min-height: 560px; }
.nb > div { min-width: 0; }
.nb-folders { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.nb-list { border-right: 1px solid var(--line); overflow-y: auto; max-height: 72vh; }
.nb-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; cursor: pointer; }
.nb-item:hover { background: var(--surface-2); }
.nb-item[aria-current="true"] { background: var(--accent-bg); }
.nb-item .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-editor { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.nb-editor .ttl { font-family: var(--f-display); font-size: 20px; font-weight: 700; border: 0; background: none; padding: 4px 0; }
.nb-editor textarea { flex: 1; min-height: 380px; border: 0; background: none; padding: 4px 0; line-height: 1.65; resize: none; }

/* ---------- Progress tracker ---------- */
function vProgress() {
  const rules = meta().dailyRules, today = todayStr();
  const doneFrac = d => { const n = dayNote(d); if (!n || !n.rules || !rules.length) return null; const c = rules.filter(r => n.rules[r.id]).length; return c / rules.length; };
  const tradeDays = new Set(S.trades.map(t => t.date));
  const start = addDays(mondayOf(today), -7 * 17);
  let cells = "";
  for (let i = 0; i < 18 * 7; i++) {
    const d = addDays(start, i); if (d > today) { cells += `<i style="opacity:0"></i>`; continue; }
    const f = doneFrac(d);
    const bg = f === null ? (tradeDays.has(d) ? "var(--line)" : "var(--surface-2)") : f === 1 ? "var(--win)" : f >= .5 ? "color-mix(in srgb, var(--win) 55%, var(--surface-2))" : f > 0 ? "color-mix(in srgb, var(--accent) 50%, var(--surface-2))" : "var(--loss-bg)";
    cells += `<i style="background:${bg}" title="${fmtDate(d)}${f === null ? "" : ": " + Math.round(f * 100) + "% of rules"}"></i>`;
  }
  let streak = 0; for (let d = today, k = 0; k < 400; k++, d = addDays(d, -1)) { const f = doneFrac(d); if (f === 1) streak++; else if (f === null && (d === today || pd(d).getDay() === 0 || pd(d).getDay() === 6)) continue; else break; }
  const pd2 = S.progressDay, nd = dayNote(pd2), checked = nd && nd.rules || {};
  const done = rules.filter(r => checked[r.id]).length;
  const last30 = Array.from({ length: 30 }, (_, i) => doneFrac(addDays(today, -i))).filter(v => v !== null);
  const tf = doneFrac(today);
  const sw = c => `<i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:4px"></i>`;
  return `<div class="pagehead"><h1>Progress Tracker</h1></div>
  <div class="grid g3"><div class="panel kpi"><div class="label">Current streak</div><div class="big">${streak} day${streak === 1 ? "" : "s"}</div><div class="sub">all rules followed</div></div>
    <div class="panel kpi"><div class="label">Rule score, last 30 days</div><div class="big">${last30.length ? Math.round(avg(last30) * 100) + "%" : "–"}</div><div class="sub">${last30.length} day${last30.length === 1 ? "" : "s"} checked in</div></div>
    <div class="panel kpi"><div class="label">Today</div><div class="big">${tf === null ? "–" : Math.round(tf * 100) + "%"}</div><div class="sub">${tf === null ? "Not checked in yet" : `of ${rules.length} daily rules`}</div></div></div>

function confirmTap(fn, label) {
  return async (el, e) => {
    if (el.dataset.armed !== "1") { const orig = el.textContent; el.dataset.armed = "1"; el.textContent = label; el.classList.remove("ghost"); setTimeout(() => { if (el.isConnected && el.dataset.armed === "1") { el.dataset.armed = ""; el.textContent = orig; } }, 4000); return; }
    el.disabled = true; try { await fn(el, e); } catch (err) { el.disabled = false; toast("That didn't work. Check your connection and try again."); }
  };
}

    $("#gSkip").addEventListener("click", async () => { try { await saveMeta({ profile: { ...profile(), skipped: true } }); } catch (e) {} S.locked = false; S.animate = true; hideGate(); render(); });
    $("#gNew").addEventListener("submit", async e => {
      e.preventDefault(); const name = $("#gName").value.trim(), pw = $("#gPw").value, pw2 = $("#gPw2").value, err = $("#gErr");
      if (!name) { err.textContent = "Enter your name."; return; } if (pw.length < 4) { err.textContent = "Password needs at least 4 characters."; return; } if (pw !== pw2) { err.textContent = "Passwords don't match."; return; }
      try { await saveMeta({ profile: { ...profile(), name, ...(await makePw(pw)), autoLock: 15, created: new Date().toISOString(), skipped: false } }); } catch (x) { err.textContent = "Couldn't save your account. Try again."; return; }
      lastAct = Date.now(); welcome(name);
    });
  });
}
let lastAct = Date.now();
["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { const m = profile().autoLock; if (S.locked === false && hasPw() && m && Date.now() - lastAct > m * 60000) lockScreen(); }, 20000);
document.addEventListener("visibilitychange", () => { const m = profile().autoLock; if (document.visibilityState === "visible" && S.locked === false && hasPw() && m && Date.now() - lastAct > m * 60000) lockScreen(); });
ACT.lockNow = () => { if (HOSTED) ACT.signOut(); else if (hasPw()) lockScreen(); };

function vProfile() {
  const p = profile(), init = (p.name || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(), st = stats(allTrades().filter(t => !t.demo));
  const ro = !Store.writable, no = !cryptoOk();
  return `<div class="pagehead"><h1>Profile</h1></div>
  <div class="grid g2">
    <div class="panel"><div class="prof-head"><div class="avatar">${esc(init)}</div><div><h2>${esc(p.name || "No account yet")}</h2><div class="muted" style="font-size:13px">${p.email ? esc(p.email) + " · " : ""}${p.created ? "Member since " + fmtDate(p.created.slice(0, 10), { month: "short", year: "numeric" }) : "Set your name below"}</div><div class="muted" style="font-size:13px">${st.total} trades journaled · ${HOSTED ? "Synced to your database" : hasPw() ? "Password on" : "No password"}</div></div></div>
      <form class="pform mt" id="pfInfo" data-live><div class="field"><label for="pf-name">Name</label><input id="pf-name" value="${esc(p.name || "")}" autocomplete="name" ${ro ? "disabled" : ""}></div>
      <div class="field"><label for="pf-email">Email (optional)</label><input id="pf-email" type="email" value="${esc(p.email || "")}" autocomplete="email" ${ro ? "disabled" : ""}></div>
      <div><button class="btn primary" data-act="saveProfile" type="button" ${ro ? "disabled" : ""}>Save profile</button></div></form></div>
    ${HOSTED ? `<div class="panel"><h3>Account</h3><p class="muted" style="margin-top:0">Signed in as <b style="color:var(--fg)">${esc((sbUser && sbUser.email) || "")}</b>. Your trades save to your own database and sync live to every device you sign in on.</p>
      <form class="pform" id="pfPw" data-live autocomplete="off">
        <div class="field"><label for="pf-new">New password</label><input type="password" id="pf-new" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="field"><label for="pf-new2">Confirm password</label><input type="password" id="pf-new2" autocomplete="new-password"></div>
        <div class="err" id="pfErr" role="alert" style="color:var(--loss);font-size:12.5px;min-height:1em"></div>
        <div class="toolbar"><button class="btn primary" type="button" data-act="webPw">Change password</button><button class="btn" type="button" data-act="signOut">Sign out</button></div></form>
      <p class="muted" style="font-size:12.5px;margin-bottom:0">Sign out when you use a shared computer, so nobody else can open your trades. Forgot your password? Sign out, then use "Forgot password?" on the sign-in screen.</p></div>` : `<div class="panel"><h3>Password &amp; privacy</h3>
      ${no ? `<p class="muted">Passwords need a secure browser connection, which this view doesn't have.</p>` : `<form class="pform" id="pfPw" data-live autocomplete="off">
        ${hasPw() ? `<div class="field"><label for="pf-cur">Current password</label><input type="password" id="pf-cur" autocomplete="current-password"></div>` : ""}
        <div class="field"><label for="pf-new">${hasPw() ? "New password" : "Set a password"}</label><input type="password" id="pf-new" autocomplete="new-password" placeholder="At least 4 characters"></div>
        <div class="field"><label for="pf-new2">Confirm password</label><input type="password" id="pf-new2" autocomplete="new-password"></div>
        <div class="err" id="pfErr" role="alert" style="color:var(--loss);font-size:12.5px;min-height:1em"></div>
        <div class="toolbar"><button class="btn primary" type="button" data-act="setPw" ${ro ? "disabled" : ""}>${hasPw() ? "Change password" : "Turn on password"}</button>${hasPw() ? `<button class="btn danger" type="button" data-act="removePw" ${ro ? "disabled" : ""}>Remove password</button>` : ""}</div></form>
      <div class="field mt" style="max-width:420px"><label for="pf-auto">Lock automatically after</label><select id="pf-auto" data-chg="autoLock" ${!hasPw() || ro ? "disabled" : ""}>${[[0, "Never"], [5, "5 minutes idle"], [15, "15 minutes idle"], [30, "30 minutes idle"], [60, "1 hour idle"]].map(([v, l]) => `<option value="${v}" ${(p.autoLock || 0) === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      ${hasPw() ? `<div class="mt"><button class="btn" data-act="lockNow">Lock now</button></div>` : ""}`}
      <p class="muted" style="font-size:12.5px;margin-bottom:0">The password locks this app's screen, so someone using your phone or laptop can't open your trades. Only a scrambled version of it is stored, never the password itself. There is no reset email, so keep it somewhere safe.</p></div>`}
  </div>`;
}
ACT.saveProfile = async () => { const name = $("#pf-name").value.trim(), email = $("#pf-email").value.trim(); await saveMeta({ profile: { ...profile(), name, email, created: profile().created || new Date().toISOString() } }); toast("Profile saved"); render(); };
ACT.setPw = async () => {
  const err = $("#pfErr"), cur = $("#pf-cur"), pw = $("#pf-new").value, pw2 = $("#pf-new2").value;
  if (hasPw() && !(await checkPw(cur.value))) { err.textContent = "Current password is wrong."; return; }
  if (pw.length < 4) { err.textContent = "New password needs at least 4 characters."; return; } if (pw !== pw2) { err.textContent = "Passwords don't match."; return; }
  const had = hasPw(); await saveMeta({ profile: { ...profile(), ...(await makePw(pw)), autoLock: profile().autoLock ?? 15, created: profile().created || new Date().toISOString() } }); lastAct = Date.now();
  toast(had ? "Password changed" : "Password on. The journal will ask for it next time."); render();
};
ACT.removePw = async () => { const cur = $("#pf-cur"); if (!(await checkPw(cur.value))) { $("#pfErr").textContent = "Enter your current password to remove it."; return; } const { hash, salt, iter, ...rest } = profile(); await saveMeta({ profile: { ...rest, hash: null } }); toast("Password removed"); render(); };
CHG.autoLock = el => { saveMeta({ profile: { ...profile(), autoLock: +el.value } }); };

function playEnter() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
  $$(".pagehead, .panel, .banner", main).forEach((el, i) => el.style.setProperty("--i", Math.min(i, 16)));
  $$(".cal .day, .cal .week", main).forEach((el, i) => el.style.setProperty("--c", i));
  $$(".kpi .big, .kpi .mid, .score-big", main).forEach(el => countUp(el));
  clearTimeout(playEnter.t); playEnter.t = setTimeout(() => main.classList.remove("enter"), 2600);
}
function countUp(el) {
  const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent)) || (el.childElementCount === 0 ? el.firstChild : null); if (!node) return;
  const txt = node.textContent, m = txt.match(/\d[\d,]*(\.\d+)?/); if (!m) return;
  const target = parseFloat(m[0].replace(/,/g, "")), dec = (m[1] || "").length - (m[1] ? 1 : 0), comma = m[0].includes(","), pre = txt.slice(0, m.index), post = txt.slice(m.index + m[0].length);
  const fmt = v => (comma ? v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec));
  const t0 = performance.now(), dur = 1100;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = pre + fmt(target * e) + post; if (k < 1) requestAnimationFrame(step); else node.textContent = txt; };
  requestAnimationFrame(step);
}

/* ================= website sign-in ================= */
const authMsg = e => { const m = String((e && e.message) || e || ""); return /invalid login/i.test(m) ? "Wrong email or password." : /not confirmed/i.test(m) ? "Confirm your email first. Open the link we sent you, then sign in." : /already registered/i.test(m) ? "That email already has an account. Sign in instead." : /fetch|network/i.test(m) ? "Couldn't reach the database. Check your internet and try again." : m || "Something went wrong. Try again."; };
function connectScreen() {
  S.locked = true; render();
  showGate(`<div class="gwrap"><form class="gcard" id="gCfg" autocomplete="off"><div class="gword">MYFUNDEDBOOK</div><h2>Connect your database</h2><div class="sub">Paste your Supabase Project URL and publishable (or anon) key. You find both in Supabase under Project Settings, then API Keys.</div>
    <input id="gUrl" placeholder="https://xxxx.supabase.co" aria-label="Project URL" spellcheck="false"><input id="gKey" placeholder="Publishable key" aria-label="Publishable key" spellcheck="false">
    <div class="err" id="gErr" role="alert"></div><button class="btn primary" type="submit" id="gGo">Connect</button></form></div>`, () => {
    $("#gCfg").addEventListener("submit", async e => {
      e.preventDefault(); const url = $("#gUrl").value.trim().replace(/\/+$/, ""), key = $("#gKey").value.trim(), err = $("#gErr");
      if (!/^https:\/\/[^\s/]+$/.test(url)) { err.textContent = "The Project URL looks like https://xxxx.supabase.co"; return; } if (key.length < 30) { err.textContent = "Paste the full publishable key."; return; }
      $("#gGo").disabled = true; err.textContent = "";
      try { await loadSupabase(); const c = supabase.createClient(url, key, { auth: { persistSession: false } }); const { error } = await c.from("journal").select("id").limit(1); if (error) throw error; }
      catch (x) { $("#gGo").disabled = false; const m = String((x && (x.message || x.code)) || x); err.textContent = /journal|42P01|relation|schema cache/i.test(m) ? "Connected, but the journal table is missing. Run the setup script in Supabase first." : /api key|jwt|401/i.test(m) ? "That key didn't work. Copy the publishable key again." : "Couldn't reach that database. Check the Project URL."; return; }
      try { localStorage.setItem("tj.supa", JSON.stringify({ url, key })); } catch (x) {}
      location.reload();
    });
  });
}
function authScreen(mode = "in", note = "") {
  S.locked = true; render();
  const up = mode === "up";
  showGate(`<div class="gwrap"><form class="gcard" id="gAuth"><div class="gword">MYFUNDEDBOOK</div><h2>${up ? "Create your account" : "Sign in"}</h2><div class="sub">${up ? "Your trades save to your own database and sync to every device you sign in on." : "Sign in to open your journal on this device."}</div>
    ${up ? `<input id="gName" placeholder="Your name" autocomplete="name" aria-label="Your name">` : ""}
    <input id="gEmail" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
    <input type="password" id="gPw" placeholder="${up ? "Password (min 6 characters)" : "Password"}" autocomplete="${up ? "new-password" : "current-password"}" aria-label="Password">
    <div class="err" id="gErr" role="alert"></div>${note ? `<div class="ok">${esc(note)}</div>` : ""}<button class="btn primary" type="submit" id="gGo">${up ? "Create account" : "Sign in"}</button>
    ${up ? "" : `<button type="button" class="glink" id="gForgot">Forgot password?</button>`}</form>
    <button class="gskip" type="button" id="gSwap">${up ? "Already have an account? Sign in" : "New here? Create an account"}</button></div>`, () => {
    setTimeout(() => $(up ? "#gName" : "#gEmail").focus(), 60);
    const err = $("#gErr"), go = $("#gGo");
    $("#gSwap").addEventListener("click", () => authScreen(up ? "in" : "up"));
    if (!up) $("#gForgot").addEventListener("click", async () => {
      const email = $("#gEmail").value.trim(); if (!email) { err.textContent = "Type your email above, then tap Forgot password."; return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) err.textContent = authMsg(error); else authScreen("in", `We sent a password reset link to ${email}.`);
    });
    $("#gAuth").addEventListener("submit", async e => {
      e.preventDefault(); const email = $("#gEmail").value.trim(), password = $("#gPw").value; err.textContent = "";
      if (!email || !password) { err.textContent = "Enter your email and password."; return; }
      go.disabled = true;
      if (up) {
        const name = $("#gName").value.trim(); if (!name) { go.disabled = false; err.textContent = "Enter your name."; return; } if (password.length < 6) { go.disabled = false; err.textContent = "Password needs at least 6 characters."; return; }
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
        if (error) { go.disabled = false; err.textContent = authMsg(error); return; }
        if (data.session) startWeb(data.session.user); else authScreen("in", `Check ${email} and tap the confirm link, then sign in here.`);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { go.disabled = false; err.textContent = authMsg(error); const f = $("#gAuth"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
        startWeb(data.session.user);
      }
    });
  });
}
function newPwScreen(user) {
  showGate(`<div class="gwrap"><form class="gcard" id="gNewPw" autocomplete="off"><div class="gword">MYFUNDEDBOOK</div><h2>Set a new password</h2><div class="sub">For ${esc(user.email || "your account")}.</div>
    <input type="password" id="gPw" placeholder="New password (min 6 characters)" autocomplete="new-password" aria-label="New password"><input type="password" id="gPw2" placeholder="Confirm password" autocomplete="new-password" aria-label="Confirm password">
    <div class="err" id="gErr" role="alert"></div><button class="btn primary" type="submit">Save password</button></form></div>`, () => {
    $("#gNewPw").addEventListener("submit", async e => {
      e.preventDefault(); const pw = $("#gPw").value, err = $("#gErr");
      if (pw.length < 6) { err.textContent = "Password needs at least 6 characters."; return; } if (pw !== $("#gPw2").value) { err.textContent = "Passwords don't match."; return; }
      const { error } = await sb.auth.updateUser({ password: pw }); if (error) { err.textContent = authMsg(error); return; }
      history.replaceState(null, "", location.pathname); toast("Password saved"); startWeb(user);
    });
  });
}
async function startWeb(user) {
  sbUser = user; S.locked = true; render();
  try { await Store.init(); }
  catch (e) { showGate(`<div class="gwrap"><div class="gcard"><div class="gword">MYFUNDEDBOOK</div><h2>Couldn't open your journal</h2><div class="sub">${esc(authMsg(e))}</div><button class="btn primary" type="button" onclick="location.reload()">Try again</button></div></div>`); return; }
  const p = profile(), name = p.name || (user.user_metadata || {}).name || "";
  if (!p.name && name) saveMeta({ profile: { ...p, name, email: p.email || user.email, created: p.created || new Date().toISOString() } }).catch(() => {});
  welcome(name || (user.email || "").split("@")[0]);
}
async function bootWeb() {
  const cfg = supaCfg(); if (!cfg) return connectScreen();
  const recovering = /type=recovery/.test(location.hash);
  try { await loadSupabase(); sb = supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); }
  catch (e) { showGate(`<div class="gwrap"><div class="gcard"><div class="gword">MYFUNDEDBOOK</div><h2>You're offline</h2><div class="sub">Couldn't reach your database. Check your internet, then try again.</div><button class="btn primary" type="button" onclick="location.reload()">Try again</button></div></div>`); return; }
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && sbUser) location.reload(); });
  const { data } = await sb.auth.getSession(), session = data && data.session;
  if (session && recovering) newPwScreen(session.user); else if (session) startWeb(session.user); else authScreen();
}
ACT.signOut = async () => { if (!sb) return; if (!confirm("Sign out of your journal on this device?")) return; try { await sb.auth.signOut(); } catch (e) {} location.reload(); };
ACT.webPw = async () => {
  const pw = $("#pf-new").value, err = $("#pfErr");
  if (pw.length < 6) { err.textContent = "New password needs at least 6 characters."; return; } if (pw !== $("#pf-new2").value) { err.textContent = "Passwords don't match."; return; }
  const { error } = await sb.auth.updateUser({ password: pw }); if (error) { err.textContent = authMsg(error); return; }
  toast("Password changed"); render();
};

/* ================= boot ================= */
render();
if (HOSTED) bootWeb();
else Store.init().then(() => {
  const p = profile();
  if (p.hash && cryptoOk()) lockScreen();
  else if (!p.name && !p.skipped && Store.writable && cryptoOk()) createScreen();
  else { S.locked = false; S.animate = true; render(); }
});
})();
</script>
